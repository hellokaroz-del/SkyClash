<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ศึกฟ้าคราม เกมยิงปืนใหญ่ผลัดตา เล่นกับบอท เล่นสองคนเครื่องเดียว หรือเล่นออนไลน์กับเพื่อน">
<script src="peerjs.min.js"></script>
<title>ศึกฟ้าคราม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Mitr:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap">
</head>
<body>
<style>
/* Layout: one column; setup panel above a 16:9 game canvas, touch controls below. Single "sky arena" look on purpose. */
:root {
  --bg: #0f2340;
  --panel: #18345c;
  --panel-2: #21457a;
  --line: #2f5c96;
  --fg: #eef5ff;
  --muted: #a9bfdc;
  --gold: #ffc94a;
  --red: #ff6b5a;
  --display: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --body: "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 16px 32px; padding-inline: 16px; display: grid; gap: 14px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; color: var(--gold); letter-spacing: .01em; }
h2 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }

#setup { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.result { font-family: var(--display); font-size: 1.25rem; color: var(--gold); }
.modes { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: inherit; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.netbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.netbox input { font: inherit; width: 9.5em; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.netbox p { flex-basis: 100%; margin: 0; }
.go:disabled { opacity: .55; cursor: default; }
.seg[aria-pressed="true"] { background: var(--gold); color: #2a1a00; border-color: var(--gold); font-weight: 600; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.pick { display: grid; gap: 8px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cls { appearance: none; text-align: left; font: inherit; color: var(--fg); background: var(--panel-2); border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.cls b { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.cls { grid-template-columns: 56px minmax(0, 1fr); column-gap: 10px; align-content: start; }
.cls > :not(.thumb) { grid-column: 2; }
.cls .thumb { grid-column: 1; grid-row: 1 / span 4; width: 56px; height: 64px; object-fit: contain; object-position: center bottom; image-rendering: auto; }
.cls small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.cls .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.cls[aria-pressed="true"] { border-color: var(--gold); background: #2a5290; }
.go { justify-self: start; appearance: none; border: 0; background: var(--red); color: #fff; font-family: var(--display); font-size: 1.1rem; padding: 10px 26px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #b6402f; }
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 #b6402f; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.field { position: relative; }
/* game screen: up to 1500px wide (50% bigger than before), but never taller than the window */
.field .stage, .field #ruler { width: min(100%, calc((100vh - 40px) * 16 / 9)); margin-inline: auto; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden; border: 3px solid #0a1830; background: #7ec8f2; box-sizing: border-box; }
/* see-through ruler strip directly under the game screen; drag to slide its zero point */
#ruler { display: block; width: 100%; height: auto; aspect-ratio: 960 / 18; margin-top: 3px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); cursor: ew-resize; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.pad { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; justify-content: space-between; }
.grp { display: flex; gap: 6px; flex-wrap: wrap; }
.pad button { appearance: none; font: inherit; font-family: var(--display); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-width: 48px; min-height: 46px; padding: 4px 12px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad button:disabled { opacity: .45; cursor: default; }
.pad .fire { background: var(--red); border-color: #b6402f; min-width: 110px; font-size: 1.1rem; }
.pad .skill { background: #2a5290; }
/* on-screen buttons only for touch devices; mouse + keyboard players use keys and the in-game slots */
@media (hover: hover) and (pointer: fine) { #pad { display: none; } }
.pad .slot { position: relative; width: 58px; height: 58px; min-width: 58px; padding: 0; overflow: hidden; border: 2px solid #b48cff; background: #0b0820; }
.pad .slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pad .slot .key { position: absolute; left: 3px; top: 2px; font-size: .7rem; line-height: 1; padding: 2px 4px; border-radius: 4px; background: rgba(10,24,48,.8); color: #fff; }
.pad .slot .cd { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,10,25,.68); color: #fff; font-size: 1.3rem; }
.pad .slot:disabled { opacity: 1; }
.pad .slot:disabled img { filter: grayscale(.7) brightness(.7); }
.pad .slot.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.tip { position: fixed; z-index: 10; max-width: 260px; padding: 10px 12px; border-radius: 10px; background: #0d1b33; border: 1px solid #b48cff; color: var(--fg); font-size: .85rem; line-height: 1.45; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.tip b { display: block; font-family: var(--display); font-weight: 600; color: var(--gold); font-size: .95rem; }
.tip small { display: block; color: var(--muted); margin-top: 4px; }
.pad button[aria-pressed="true"] { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
.keys { font-size: .85rem; }
kbd { font-family: var(--body); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: .8rem; }
@media (max-width: 520px) { h1 { font-size: 1.5rem; } .pad .fire { flex: 1; } }
.admin { position: absolute; right: 1.2%; top: 38%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; }
.admin-btn { font: 600 13px "Mitr", "Noto Sans Thai", sans-serif; color: #ffd36a; background: rgba(12,30,60,.8); border: 1px solid rgba(255,211,106,.6); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.admin-btn.on { background: rgba(120,60,10,.85); }
.admin-menu { background: rgba(12,30,60,.92); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; font-family: "Mitr", "Noto Sans Thai", sans-serif; }
.admin-menu[hidden] { display: none; }
.admin-menu label { color: #eef5ff; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.admin-menu input { accent-color: #ffd36a; width: 16px; height: 16px; }
.admin-pin .pin-row { display: flex; gap: 6px; align-items: center; }
.admin-pin #admin-code { width: 84px; height: auto; font: 600 14px "Mitr", sans-serif; letter-spacing: .2em; color: #eef5ff; background: rgba(4,14,30,.9); border: 1px solid rgba(255,211,106,.6); border-radius: 6px; padding: 4px 8px; }
.admin-pin .pin-err { color: #ff8a7a; font-size: 12px; }
/* game maker: full-screen editor over the game, opened from the Admin menu */
#maker { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--fg); display: grid; grid-template-rows: auto 1fr; font-family: var(--body); }
body.mk-open { overflow: hidden; }
.mk-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.mk-top h2 { font-family: var(--display); color: var(--gold); font-size: 1.25rem; margin-right: 8px; }
.mk-tabs { display: flex; gap: 6px; }
.mk-tab, .mk-btn { appearance: none; font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.mk-tab[aria-selected="true"] { background: var(--gold); color: #2a1a00; border-color: var(--gold); font-weight: 600; }
.mk-btn:disabled { opacity: .5; cursor: default; }
.mk-btn.primary { background: var(--red); border-color: #b6402f; color: #fff; font-weight: 600; }
.mk-btn.good { background: #2f8a4e; border-color: #2f8a4e; color: #fff; font-weight: 600; }
.mk-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
#mk-save-state { flex-basis: 100%; color: var(--muted); font-size: .85rem; min-height: 1.2em; }
.mk-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
.mk-side { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.mk-side .mk-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
#mk-list { display: flex; flex-direction: column; gap: 4px; }
.mk-item { appearance: none; text-align: left; font: inherit; color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.mk-item:hover { background: var(--panel); }
.mk-item[aria-pressed="true"] { background: #2a5290; border-color: var(--gold); }
.mk-item .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
#mk-form { overflow: auto; padding: 14px 20px 40px; display: grid; gap: 8px; align-content: start; max-width: 860px; }
.mk-sec { font-family: var(--display); font-weight: 600; font-size: 1rem; color: var(--gold); margin: 10px 0 0; }
.mk-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.mk-lab { color: var(--muted); font-size: .9rem; }
.mk-hint { grid-column: 2; color: var(--muted); font-size: .8rem; }
p.mk-hint { grid-column: auto; margin-top: 8px; }
.mk-row input[type=text], .mk-row textarea, .mk-row select, .mk-num input[type=number] { font: inherit; color: var(--fg); background: #0c1d36; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.mk-row textarea { min-height: 64px; resize: vertical; }
.mk-row input[type=color] { width: 56px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
.mk-num { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 10px; align-items: center; }
.mk-num input[type=range] { accent-color: var(--gold); width: 100%; }
.mk-check { display: flex; align-items: center; gap: 6px; }
.mk-check input { accent-color: var(--gold); width: 18px; height: 18px; }
.mk-asset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mk-asset select { flex: 1 1 200px; }
.mk-prev img { display: block; max-height: 64px; max-width: 120px; object-fit: contain; background: repeating-conic-gradient(#20324f 0 25%, #2a3f61 0 50%) 0 0 / 12px 12px; border-radius: 6px; }
button.mk-prev { appearance: none; font: inherit; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.mk-stage { width: 100%; height: auto; border-radius: 10px; border: 2px solid #0a1830; }
@media (max-width: 760px) {
  .mk-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .mk-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  .mk-row { grid-template-columns: 1fr; } .mk-hint { grid-column: 1; }
}
</style>

<div class="wrap">
  <section id="setup" aria-label="ตั้งค่าการต่อสู้">
    <div class="head">
      <h1>ศึกฟ้าคราม</h1>
      <p class="muted">เกมยิงปืนใหญ่ผลัดตา เล็งมุม กะแรง อ่านลม แล้วถล่มคู่ต่อสู้</p>
    </div>
    <p id="result" class="result" hidden></p>
    <div class="modes" role="group" aria-label="โหมด">
      <button class="seg" id="mode-bot" aria-pressed="true">เล่นกับบอท</button>
      <button class="seg" id="mode-pvp" aria-pressed="false">2 ผู้เล่น เครื่องเดียว</button>
      <button class="seg" id="mode-net" aria-pressed="false">ออนไลน์</button>
    </div>
    <div class="netbox" id="net" hidden>
      <button class="seg" id="net-make">สร้างห้อง</button>
      <input id="net-code" inputmode="numeric" maxlength="4" placeholder="รหัสห้อง 4 หลัก" aria-label="รหัสห้อง" autocomplete="off">
      <button class="seg" id="net-join">เข้าห้อง</button>
      <button class="seg" id="net-leave" hidden>ออกจากห้อง</button>
      <p class="muted" id="net-msg" role="status"></p>
    </div>
    <div class="modes" role="group" aria-label="ด่าน" id="stages"></div>
    <div class="picks">
      <div class="pick"><h2 id="p1-label">ผู้เล่น 1 เลือกอาชีพ</h2><div class="cards" id="cards-0"></div></div>
      <div class="pick"><h2 id="p2-label">บอท เลือกอาชีพ</h2><div class="cards" id="cards-1"></div></div>
    </div>
    <button class="go" id="start">เริ่มต่อสู้</button>
  </section>

  <div class="field" id="field">
    <div class="stage"><canvas id="game" width="960" height="540" aria-label="สนามรบ"></canvas>
      <div class="admin" id="admin">
        <button type="button" class="admin-btn" id="snd-btn" aria-pressed="true">เสียง: เปิด</button>
        <button type="button" class="admin-btn" id="admin-btn" aria-expanded="false">Admin</button>
        <form class="admin-menu admin-pin" id="admin-pin" hidden autocomplete="off">
          <label for="admin-code">ใส่รหัส Admin</label>
          <div class="pin-row"><input id="admin-code" type="password" inputmode="numeric" maxlength="8" aria-describedby="admin-err"><button type="submit" class="admin-btn">ตกลง</button></div>
          <small id="admin-err" class="pin-err" hidden>รหัสไม่ถูกต้อง</small>
        </form>
        <div class="admin-menu" id="admin-menu" hidden>
          <label><input type="checkbox" data-k="god"> อมตะ</label>
          <label><input type="checkbox" data-k="pow"> เกจเต็ม</label>
          <label><input type="checkbox" data-k="nocd"> สกิลไม่คูลดาวน์</label>
          <label><input type="checkbox" data-k="hitbox"> แสดงกรอบโดน (hit box)</label>
          <button type="button" class="admin-btn" id="maker-btn">ตัวสร้างเกม</button>
        </div>
      </div>
    </div>
    <canvas id="ruler" width="960" height="18" aria-label="ไม้บรรทัดวัดช่อง 1 จอเท่ากับ 10 ช่อง ลากเพื่อเลื่อนจุดเริ่ม"></canvas>
  </div>

  <div class="pad" id="pad">
    <div class="grp">
      <button id="b-left" aria-label="เดินซ้าย">◀</button>
      <button id="b-right" aria-label="เดินขวา">▶</button>
      <button id="b-up" aria-label="เพิ่มมุม">▲</button>
      <button id="b-down" aria-label="ลดมุม">▼</button>
    </div>
    <div class="grp">
      <button id="b-warp" class="skill">บิน (F)</button>
      <button id="b-skill" class="skill">ทักษะ</button>
      <button id="b-skill2" class="skill" hidden>ทักษะ 2</button>
      <button id="b-fire" class="fire">กดค้าง ยิง</button>
    </div>
  </div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <section id="maker" hidden aria-label="ตัวสร้างเกม">
    <div class="mk-top">
      <h2>ตัวสร้างเกม</h2>
      <div class="mk-tabs" role="tablist">
        <button type="button" class="mk-tab" role="tab" data-t="classes">อาชีพ</button>
        <button type="button" class="mk-tab" role="tab" data-t="skills">สกิล</button>
        <button type="button" class="mk-tab" role="tab" data-t="stages">ด่าน</button>
      </div>
      <div class="mk-actions">
        <button type="button" class="mk-btn primary" id="mk-play">เล่นทดสอบ</button>
        <button type="button" class="mk-btn good" id="mk-save" hidden>บันทึกลงเกม</button>
        <button type="button" class="mk-btn" id="mk-export">ดาวน์โหลดสำรอง</button>
        <button type="button" class="mk-btn" id="mk-import">นำเข้า</button>
        <input type="file" id="mk-import-file" accept=".json,application/json" hidden>
        <button type="button" class="mk-btn" id="mk-reset">คืนค่าเดิม</button>
        <button type="button" class="mk-btn" id="mk-close">ปิด</button>
      </div>
      <p id="mk-save-state" role="status"></p>
    </div>
    <div class="mk-body">
      <nav class="mk-side">
        <div class="mk-tools">
          <button type="button" class="mk-btn" id="mk-add">+ เพิ่ม</button>
          <button type="button" class="mk-btn" id="mk-copy">ทำสำเนา</button>
          <button type="button" class="mk-btn" id="mk-del">ลบ</button>
        </div>
        <div id="mk-list"></div>
      </nav>
      <div id="mk-form"></div>
    </div>
  </section>
</div>

<script>
(() => {
const VW = 960, VH = 540, WW = 1800, WH = 760;
const SEG = VW / 10; // 1 screen = 10 distance slots, as players count them
const G = 0.18, MAXV = 20, WINDK = 0.008, TURN_TIME = 15, CHARGE_SPD = 0.384; // power per frame: 0 to 100 in ~4.3 s (two 20% cuts from 0.6)
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
// backing resolution follows the on-screen size so the bigger game screen stays sharp
let RES = DPR; var STRIP_READY = false;
function fitCanvas() {
  const k = Math.min(3, Math.max(1, (cv.clientWidth || VW) / VW * (window.devicePixelRatio || 1)));
  if (Math.abs(k - RES) < 0.05 && cv.width === Math.round(VW * k)) return;
  RES = k; cv.width = Math.round(VW * k); cv.height = Math.round(VH * k); ctx.setTransform(k, 0, 0, k, 0, 0);
  if (STRIP_READY) drawStripResize();
}
fitCanvas();
addEventListener('resize', fitCanvas);

const mask = new Uint8Array(WW * WH);

const tctx = terr.getContext('2d');

}
function paintTerrain(R) {

  for (let i = 0; i < 900; i++) pebbles.add(Math.floor(R() * WW * WH));

// ---------- projectile physics (shared with bot simulation) ----------
function makeProj(p, angleDeg, power, extra) {

  const tip = CAST[p.k] ? 30 : 8; // the mage's shot leaves from the staff orb
  const q = Object.assign({ x: p.x + p.face * tip, y: p.y - 22, vx: Math.cos(a) * v * p.face, vy: -Math.sin(a) * v,
    gf: p.c.gf, wf: 1, owner: p.i, age: 0, delay: 0, trail: [], kind: p.c.shot, spin: 0 }, extra || {});
  if (q.kind && q.kind.startsWith('a:')) { q.src = q.kind; q.img = assetImage(q.kind); q.kind = 'img'; }

}
// returns 0 flying, 1 hit, 2 out
function stepProj(q, players, wind) {
  q.age++;

    q.vy += G * q.gf / 4; q.vx += wind * WINDK * q.wf / 4;
    q.x += q.vx / 4; q.y += q.vy / 4;
    if (q.x < -300 || q.x > WW + 300 || q.y > WH + 60) return 2;
    if (q.y >= 0 && solid(q.x, q.y)) return 1;
    for (const pl of players) {
      if (!pl.alive || (pl.i === q.owner && q.age < 12)) continue;
      if (boxDist(pl, q.x, q.y) === 0) return 1;
    }
  }

function warpTo(q) {

  // beside the wall, not on top of it), step clear of the wall, then let gravity drop you to the ground
  const sp = Math.hypot(q.vx, q.vy) || 1, ux = -q.vx / sp, uy = -q.vy / sp;

  pl.x = x; pl.y = y; pl.vy = 0;

// ---------- bot ----------

// --- storage: draft in IndexedDB, saved copy in the artifact ---
function idb() {
  return new Promise((ok, no) => { try { const r = indexedDB.open('sky-maker', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); } catch (_) { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise(ok => { const t = db.transaction('kv', 'readwrite'); v == null ? t.objectStore('kv').delete(k) : t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (_) {} }
let draftTimer = 0;
function touched() {
  MK.dirty = true; showSaveState(); clearTimeout(MK.rt); MK.rt = setTimeout(() => reloadData(GD), 250);
  clearTimeout(draftTimer); draftTimer = setTimeout(() => idbSet('draft', JSON.parse(JSON.stringify(GD))), 600);
}
async function artifactApi() {
  if (MK.art !== undefined) return MK.art;
  try { MK.art = window.claude && window.claude.use ? await window.claude.use('artifact') : null; } catch (_) { MK.art = null; }
  return MK.art;
}
function dataURLBlob(u) {
  const [h, b] = u.split(','), type = h.slice(5).split(';')[0], bin = atob(b), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type });
}
const EXT = { 'image/png': 'png', 'image/webp': 'webp', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'audio/mpeg': 'mp3', 'audio/mp3': 'mp3', 'audio/wav': 'wav', 'audio/x-wav': 'wav', 'audio/ogg': 'ogg', 'audio/webm': 'webm' };
async function saveGame() {

  if (!art) { st.textContent = 'หน้านี้บันทึกลงเกมไม่ได้ (เปิดจากลิงก์เกมใน Claude แทน) งานยังเก็บไว้ในเครื่องนี้'; return; }
  const files = {}, out = JSON.parse(JSON.stringify(GD));
  for (const [id, a] of Object.entries(GD.assets)) {
    if (!a.path && a.data) {
      const type = a.data.slice(5).split(';')[0], ext = EXT[type] || (a.kind === 'audio' ? 'mp3' : 'png');
      const path = `maker/${id}.${ext}`; files[path] = dataURLBlob(a.data); out.assets[id].path = path;
    }
    delete out.assets[id].data;
  }
  files['game-data.json'] = { content: JSON.stringify(out), contentType: 'application/json' };
  st.textContent = 'กำลังบันทึก...';
  try {
    await art.publish(files);
    for (const id of Object.keys(out.assets)) GD.assets[id].path = out.assets[id].path;
    MK.dirty = false; await idbSet('draft', null);
    st.textContent = 'บันทึกแล้ว ทุกคนที่เปิดเกมจะได้เวอร์ชันนี้';
  } catch (e) {
    const c = e && e.code;
    st.textContent = c === 'capability_disabled' ? 'บันทึกไม่ได้ตอนเกมแชร์แบบใครมีลิงก์ก็ดูได้ ปิดการแชร์สาธารณะในเมนู Share ก่อน แล้วกดบันทึกอีกครั้ง (งานยังเก็บไว้ในเครื่องนี้)'
      : c === 'not_writer' || c === 'not_granted' ? 'บัญชีนี้แก้เกมนี้ไม่ได้ งานยังเก็บไว้ในเครื่องนี้'
      : c === 'too_large' ? 'ไฟล์ใหญ่เกินไป ลองใช้รูปหรือเสียงที่เล็กลง'
      : c === 'conflict' ? 'มีคนบันทึกเวอร์ชันใหม่ก่อน หน้าจะโหลดใหม่ งานของคุณยังอยู่ในเครื่องนี้'

}
function showSaveState() { $m('mk-save-state').textContent = MK.dirty ? 'มีการแก้ไขที่ยังไม่บันทึก (เก็บในเครื่องนี้แล้ว)' : ''; }
async function exportData() {

  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (_) {}
  if (dl) { try { await dl.save({ filename: name, data: new Blob([out], { type: 'application/json' }) }); return; } catch (_) { return; } }

function importData(file) {
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.classes || !d.skills || !d.stages) throw 0; d.assets = d.assets || {}; GD = d; touched(); renderMaker(); } catch (_) { alert('ไฟล์นี้ไม่ใช่ข้อมูลเกม'); } };
  r.readAsText(file);

// --- uploads: pictures are scaled down and re-encoded, sounds kept as they are ---
function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function readURL(file) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); }); }
async function processImage(file, o) {
  const im = new Image(); im.src = await readURL(file); await im.decode();
  let w = im.naturalWidth, h = im.naturalHeight;
  if (o.exact) { w = o.exact[0]; h = o.exact[1]; }
  else { const k = Math.min(1, (o.maxW || 1e9) / w, (o.maxH || 1e9) / h); w = Math.round(w * k); h = Math.round(h * k); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(im, 0, 0, w, h);
  return c.toDataURL(o.png ? 'image/png' : 'image/webp', 0.92);
}
async function addAsset(file, kind, o) {
  const data = kind === 'audio' ? await readURL(file) : await processImage(file, o || {});
  if (data.length > 12e6) { alert('ไฟล์ใหญ่เกินไป (เกินประมาณ 9 MB)'); return null; }
  const id = newId('u'); GD.assets[id] = { name: file.name, kind, data };
  return 'a:' + id;
}

// --- form building ---
function fieldRow(label, input, hint) {
  const row = document.createElement('label'); row.className = 'mk-row';
  row.innerHTML = `<span class="mk-lab">${label}</span>`;
  row.appendChild(input);
  if (hint) { const h = document.createElement('small'); h.className = 'mk-hint'; h.textContent = hint; row.appendChild(h); }
  return row;
}
function inText(obj, key, multi) {
  const el = document.createElement(multi ? 'textarea' : 'input'); if (!multi) el.type = 'text';
  el.value = obj[key] || ''; el.oninput = () => { obj[key] = el.value; touched(); refreshList(); }; return el;
}
function inNum(obj, key, min, max, step, def) {
  const wrap = document.createElement('span'); wrap.className = 'mk-num';
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step;
  const n = document.createElement('input'); n.type = 'number'; n.min = min; n.max = max; n.step = step;
  const v = obj[key] != null ? obj[key] : def; r.value = n.value = v;
  const set = x => { const f = Math.max(min, Math.min(max, +x || 0)); obj[key] = f; r.value = n.value = f; touched(); };
  r.oninput = () => set(r.value); n.onchange = () => set(n.value);
  wrap.append(r, n); return wrap;
}
function inSelect(obj, key, opts, after) {
  const el = document.createElement('select');
  for (const [v, t] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; el.appendChild(o); }
  el.value = obj[key] || ''; if (el.value !== (obj[key] || '')) el.value = opts[0][0];
  el.onchange = () => { obj[key] = el.value; touched(); if (after) after(); }; return el;
}
function inCheck(obj, key, text, after) {
  const w = document.createElement('span'); w.className = 'mk-check';
  const el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!obj[key];
  el.onchange = () => { obj[key] = el.checked; touched(); if (after) after(); };
  w.append(el, document.createTextNode(' ' + text)); return w;
}
// a picture/sound picker: built-in choices + "uploaded" + an upload button, with a preview
function inAsset(obj, key, kind, builtins, o, after) {
  const w = document.createElement('div'); w.className = 'mk-asset';
  const uploads = Object.entries(GD.assets).filter(([, a]) => a.kind === kind).map(([id, a]) => ['a:' + id, 'อัปโหลด: ' + a.name]);
  const sel = document.createElement('select');
  for (const [v, t] of builtins.concat(uploads)) { const op = document.createElement('option'); op.value = v; op.textContent = t; sel.appendChild(op); }
  sel.value = obj[key] || '';
  const prev = document.createElement(kind === 'audio' ? 'button' : 'span'); prev.className = 'mk-prev';
  const show = () => {
    const v = obj[key] || '';
    if (kind === 'audio') { prev.type = 'button'; prev.textContent = '▶ ฟัง'; prev.disabled = !v; }
    else { const u = v.startsWith('a:') ? assetURL(v) : (o && o.builtinURL ? o.builtinURL(v) : ''); prev.innerHTML = u ? `<img alt="" src="${u}">` : ''; }
  };
  if (kind === 'audio') prev.onclick = e => { e.preventDefault(); const v = obj[key]; const a = new Audio(v && v.startsWith('a:') ? assetURL(v) : SFX_SRC[v] || assetURL(v)); a.play().catch(() => {}); };
  sel.onchange = () => { obj[key] = sel.value; show(); touched(); if (after) after(); };
  const up = document.createElement('input'); up.type = 'file'; up.accept = kind === 'audio' ? 'audio/*' : 'image/*'; up.hidden = true;
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'mk-btn'; btn.textContent = 'อัปโหลด...';
  btn.onclick = () => up.click();
  up.onchange = async () => {
    if (!up.files[0]) return;
    btn.disabled = true; btn.textContent = 'กำลังโหลด...';
    try { const ref = await addAsset(up.files[0], kind, o); if (ref) { obj[key] = ref; touched(); if (after) after(); renderForm(); return; } }
    catch (_) { alert('เปิดไฟล์นี้ไม่ได้'); }
    btn.disabled = false; btn.textContent = 'อัปโหลด...';

}

  const draw = () => {
    const x = cv2.getContext('2d'); x.clearRect(0, 0, 720, 304);
    const bg = refImage(st.bg), fg = refImage(st.fg || 'hills');
    x.fillStyle = '#6fb0d8'; x.fillRect(0, 0, 720, 304);
    const go = () => { if (bg && ready(bg)) x.drawImage(bg, 0, 0, 720, 304); if (fg && ready(fg)) x.drawImage(fg, 0, 0, 720, 304);
      (st.spawn || [500, 1300]).forEach((sx, i) => { const px = sx / WW * 720; x.fillStyle = i ? '#ff5a4a' : '#4aa8ff'; x.beginPath(); x.moveTo(px - 8, 20); x.lineTo(px + 8, 20); x.lineTo(px, 34); x.fill();
        x.font = '600 13px ' + FONT; x.textAlign = 'center'; x.fillText('P' + (i + 1), px, 15); }); };
    go(); Promise.all([bg, fg].filter(Boolean).map(im => im.decode().catch(() => {}))).then(go);
  };
  f.append(cv2);
  f.append(fieldRow('รูปฉากหลัง', inAsset(st, 'bg', 'image', IMG_OPTS.bg, { maxW: 1920, maxH: 1080 }, draw), 'รูปไกล ๆ ด้านหลัง ขยับช้ากว่ากล้องเล็กน้อย'));
  f.append(fieldRow('รูปพื้น', inAsset(st, 'fg', 'image', IMG_OPTS.fg, { exact: [WW, WH], png: true }, draw), 'PNG ขนาด 1800×760 ส่วนโปร่งใสคืออากาศ ส่วนทึบคือพื้นที่ยืนได้'));
  f.append(fieldRow('ขอบเขตพื้น (ไม่บังคับ)', inAsset(st, 'col', 'image', IMG_OPTS.col, { exact: [WW, WH], png: true }), 'รูปขาวดำ ขาว = พื้น ใช้เมื่ออยากให้บางส่วนของรูปพื้นทะลุได้'));
  f.append(fieldRow('', inCheck(st, 'hard', 'พื้นแข็ง ระเบิดแล้วไม่เป็นหลุม')));
  if (!st.spawn) st.spawn = [500, 1300];
  const sp = { a: st.spawn[0], b: st.spawn[1] };
  const spIn = (k, i) => { const el = inNum(sp, k, 40, WW - 40, 10, sp[k]); el.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { st.spawn[i] = sp[k]; draw(); })); el.querySelector('input[type=number]').addEventListener('change', () => { st.spawn[i] = sp[k]; draw(); touched(); }); return el; };
  f.append(fieldRow('จุดเกิดผู้เล่น 1 (ซ้าย-ขวา)', spIn('a', 0)));
  f.append(fieldRow('จุดเกิดผู้เล่น 2', spIn('b', 1)));
  f.append(fieldRow('เริ่มหาพื้นจากความสูง', inNum(st, 'scanFrom', 0, 600, 10, 0), 'ใช้ข้ามยอดไม้หรือเพดาน: ตัวละครจะเกิดบนพื้นแรกที่อยู่ต่ำกว่าเส้นนี้'));
  f.append(fieldRow('เพลงในด่าน', inAsset(st, 'music', 'audio', [['', 'ไม่มีเพลง']].concat(st.music && !st.music.startsWith('a:') ? [[st.music, 'เพลงเดิมของด่าน']] : []))));
  draw();
}
function renderForm() {
  const f = $m('mk-form'); f.textContent = '';
  const k = MK.sel[MK.tab], it = items()[k];
  if (!it) return;
  if (MK.tab === 'classes') classForm(f, it); else if (MK.tab === 'skills') skillForm(f, it); else stageForm(f, it);
}
function renderMaker() {
  if (!items()[MK.sel[MK.tab]]) MK.sel[MK.tab] = Object.keys(items())[0];
  document.querySelectorAll('#maker .mk-tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === MK.tab)));
  $m('mk-add').textContent = '+ เพิ่ม' + TABS[MK.tab];
  refreshList(); renderForm(); showSaveState();
}
function openMaker() {
  $m('maker').hidden = false; document.body.classList.add('mk-open'); renderMaker();
  artifactApi().then(a => { $m('mk-save').hidden = !a; });
}
function closeMaker() { $m('maker').hidden = true; document.body.classList.remove('mk-open'); }
document.querySelectorAll('#maker .mk-tab').forEach(b => b.onclick = () => { MK.tab = b.dataset.t; renderMaker(); });
$m('mk-add').onclick = addItem; $m('mk-copy').onclick = copyItem; $m('mk-del').onclick = delItem;
$m('mk-close').onclick = closeMaker;
$m('mk-play').onclick = () => { closeMaker(); document.getElementById('setup').hidden = false; document.getElementById('setup').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
$m('mk-save').onclick = saveGame;
$m('mk-export').onclick = exportData;
$m('mk-import').onclick = () => $m('mk-import-file').click();
$m('mk-import-file').onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; };
$m('mk-reset').onclick = () => { if (!confirm('คืนค่าเกมเป็นแบบเดิมทั้งหมด? (ยังไม่บันทึกจนกว่าจะกดบันทึก)')) return; GD = JSON.parse(JSON.stringify(DEFAULT_DATA)); touched(); renderMaker(); };
$m('maker-btn').onclick = () => { openMaker(); };

// the saved game data published next to the page, then any unsaved draft from this browser
async function loadSavedData() {
  let base = null;
  try { const r = await fetch('game-data.json', { cache: 'no-cache' }); if (r.ok) base = await r.json(); } catch (_) {}
  if (base) { base.assets = base.assets || {}; reloadData(base); }
  const d = await idbGet('draft');
  if (d && d.classes) { MK.dirty = true; reloadData(d); }
}

applyData(embeddedData()); buildSetup(); startDemo();
loadSavedData();
cam.x = 0;
fitCanvas(); drawStripResize();
requestAnimationFrame(loop);
window.__game = { NET, get S() { return S; }, get cam() { return cam; }, input, fire, useSkill, botPlan, useUlt };
})();
</script>
